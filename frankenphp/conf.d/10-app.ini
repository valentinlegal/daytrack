; Réglages PHP communs au développement et à la production.

; PHP ne dit pas sa version dans les réponses.
expose_php = 0

; Les instants restent en heure universelle. Le jour de l'utilisateur se lit dans
; le fuseau de ses réglages, à un seul endroit du code, jamais dans celui-ci.
date.timezone = UTC

; Le code reste en mémoire entre deux requêtes ; ces réserves évitent de relire le
; disque pour retrouver un fichier déjà ouvert.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
