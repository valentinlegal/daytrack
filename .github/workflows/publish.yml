name: Publication

# Lancé à la demande, sur le tag d'une version, une fois son code poussé : un seul
# déclencheur, donc une seule construction par lancement. Il se relance de la même façon :
# « Run workflow », puis le tag de la version.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Rien ne se publie si les tests échouent : les images se construisent en même temps
  # qu'eux, mais sans nom, et personne ne tire une image sans nom.
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Lancé sur une branche ou sur une version plus ancienne que la dernière, il déplacerait
      # « latest » vers ce qui n'est pas la dernière version.
      - name: La dernière version
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          if [ "$GITHUB_REF_TYPE" != tag ] || ! grep -q -E '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$version"; then
              echo "::error::Se lance sur le tag d'une version, comme v2.0.1, pas sur « $GITHUB_REF_NAME »."
              exit 1
          fi
          highest="$(git ls-remote --tags --refs origin 'v*' | sed -e 's|.*refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$highest" != "$version" ]; then
              echo "::error::La dernière version est la $highest : la $version ne se republie pas par-dessus."
              exit 1
          fi
      - run: bin/setup
      - name: Tests du serveur
        run: docker compose exec -T app php bin/phpunit
      - name: Tests du navigateur
        run: docker compose run --rm node npm test

  # Une construction par architecture, chacune sur sa machine : l'émulation prendrait
  # dix fois plus de temps. Elles ne partent que par leur empreinte : seule la publication
  # les nomme.
  image-amd64:
    name: Image amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          target: prod
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

  image-arm64:
    name: Image arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          target: prod
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  # Le numéro entier (« 2.5.0 ») est ce que lit l'avis de nouvelle version, et « latest »
  # ce que suit le docker-compose.yml : tout paraît ici, en une fois, une fois les tests
  # passés et les deux architectures prêtes.
  publication:
    name: Publier
    needs: [tests, image-amd64, image-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: Réunir les deux architectures
        env:
          AMD64: ${{ needs.image-amd64.outputs.digest }}
          ARM64: ${{ needs.image-arm64.outputs.digest }}
        run: |
          tags=()
          while IFS= read -r tag; do tags+=(-t "$tag"); done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"
