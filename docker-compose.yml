# Installer DayTrack : ce fichier, puis « docker compose up -d », puis
# https://localhost dans le navigateur.
#
# DayTrack n'a pas de compte : quiconque l'atteint agit en votre nom, jusque dans Jira.
# C'est pour ça qu'il ne répond qu'à cette machine (127.0.0.1).
services:
  daytrack:
    image: ghcr.io/valentinlegal/daytrack:latest
    container_name: daytrack
    restart: unless-stopped
    # Le nombre du milieu est le port de cette machine : changez-le s'il est pris. Celui de
    # la ligne 443 fait l'adresse, https://localhost:<ce port>. Gardez 127.0.0.1 : sans lui,
    # DayTrack s'ouvre à tout le réseau.
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - db_data:/app/db # Vos journées
      - caddy_data:/data # La clé qui chiffre votre jeton Jira, et le certificat
      - caddy_config:/config
    environment:
      SERVER_NAME: "localhost, daytrack.localhost"

volumes:
  db_data:
  caddy_data:
  caddy_config:
