services:
  daytrack:
    image: ghcr.io/valentinlegal/daytrack:latest
    container_name: daytrack
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - db_data:/app/db # BDD (SQLite)
      - caddy_data:/data # Certificats TLS (géré automatiquement par Caddy)
      - caddy_config:/config
    environment:
      # Domaine de l'application.
      # En local : laisser "daytrack.localhost" (certificat auto-signé).
      # En production : mettre votre domaine (ex: daytrack.mondomaine.com).
      # Caddy obtient automatiquement un certificat Let's Encrypt.
      # Pour désactiver HTTPS : mettre ":80" à la place du domaine.
      # Ne pas modifier ", php:80" — requis pour le fonctionnement interne.
      SERVER_NAME: "daytrack.localhost, php:80"

      # Intégration Jira (optionnel — laisser vide pour désactiver)
      # Deux types de jetons possibles (générer sur https://id.atlassian.com → Security → API tokens) :
      #
      #   Jeton avec périmètres (recommandé) → "Create API token with scopes"
      #     Périmètres à cocher : read:jira-work  et  write:jira-work
      #     Cloud ID : curl https://monentreprise.atlassian.net/_edge/tenant_info
      #     JIRA_BASE_URL: https://api.atlassian.com/ex/jira/<CLOUD_ID>
      #
      #   Jeton classique → "Create API token"
      #     JIRA_BASE_URL: https://monentreprise.atlassian.net
      JIRA_BASE_URL:
      JIRA_USER_EMAIL:
      JIRA_API_TOKEN:
      # Types de tickets et couleurs (format: Type:couleur,Type:couleur)
      # Couleurs disponibles : emerald, orange, red, purple, indigo, sky, amber, pink, teal, yellow, green, blue
      JIRA_TICKET_TYPES: "Story:green,Bug:red,Epic:purple,Task:blue,Sub-task:sky,Subtask:sky"

volumes:
  db_data:
  caddy_data:
  caddy_config:
